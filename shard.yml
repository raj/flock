name: flock
version: 0.1.0

authors:
  - Raj Deenoo

description: |
  A data-oriented (ECS) game engine in Crystal, inspired by Bevy, on top of
  wgpu-cr (rendering) and SDL3 (window, input, gamepads, audio). See plan.md.

crystal: ">= 1.16.0"

license: MIT

dependencies:
  wgpu:
    github: raj/wgpu-cr
    version: ~> 0.1.0
  sdl3:
    github: raj/sdl3-cr
    version: ~> 0.1.0

# The ECS + math core depends on no native lib (`require "flock"`, headless).
# The platform/rendering layer (`require "flock/gpu"`) uses the shards wgpu-cr
# (wgpu-native, shard name `wgpu`) and sdl3-cr (SDL3 via pkg-config, shard name
# `sdl3`). Run `shards install` to fetch them into lib/ (wgpu-cr's postinstall
# downloads the wgpu-native binary).

targets:
  space_invaders:
    main: examples/space_invaders.cr
  window_app:
    main: examples/window_app.cr
  custom_shader:
    main: examples/custom_shader.cr
  change_detection:
    main: examples/change_detection.cr
