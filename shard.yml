name: flock
version: 0.1.0

authors:
  - Raj Deenoo

description: |
  A data-oriented (ECS) game engine in Crystal, inspired by Bevy, on top of
  wgpu-cr (rendering) and SDL3 (window, input, gamepads, audio). See plan.md.

crystal: ">= 1.16.0"

license: MIT

# The ECS + math core depends on no native lib (`require "flock"`, headless).
# The platform/rendering layer (`require "flock/gpu"`) uses the neighboring shards
# via relative path: ../wgpu-cr (wgpu-native) and ../sdl3-cr (SDL3, linked via
# pkg-config). No `shards install` needed for the examples. See README.md.

targets:
  space_invaders:
    main: examples/space_invaders.cr
  window_app:
    main: examples/window_app.cr
  custom_shader:
    main: examples/custom_shader.cr
