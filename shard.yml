name: flock
version: 0.1.0

authors:
  - Raj Deenoo

description: |
  A data-oriented (ECS) game engine in Crystal, inspired by Bevy, on top of
  wgpu-cr (rendering) and SDL3 (window, input, gamepads, audio). See plan.md.

crystal: ">= 1.16.0"

license: MIT

dependencies:
  wgpu:
    path: ../wgpu-cr
  sdl3:
    path: ../sdl3-cr

# The ECS + math core depends on no native lib (`require "flock"`, headless).
# The platform/rendering layer (`require "flock/gpu"`) uses the sibling shards
# wgpu-cr (wgpu-native) and sdl3-cr (SDL3, linked via pkg-config), resolved as
# path dependencies so `shards install` works in this monorepo layout.

targets:
  space_invaders:
    main: examples/space_invaders.cr
  window_app:
    main: examples/window_app.cr
  custom_shader:
    main: examples/custom_shader.cr
  change_detection:
    main: examples/change_detection.cr
