name: coverage

# Separate from ci.yml so a coverage/upload hiccup never turns the build/tests badges red.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      # kcov isn't packaged on Ubuntu 24.04 and the prebuilt binary targets an older
      # binutils, so build it from source against the system libraries.
      - name: Build and install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ binutils-dev libcurl4-openssl-dev libdw-dev libiberty-dev zlib1g-dev libssl-dev
          git clone --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-build

      # kcov wraps a real binary, so build one that requires every spec file. Only the
      # headless core is spec-reachable, so the native layer isn't compiled or measured.
      - name: Build the spec binary
        run: |
          mkdir -p bin
          for f in spec/*_spec.cr; do echo "require \"./$f\""; done > .spec_runner.cr
          crystal build .spec_runner.cr -o bin/spec_runner

      - name: Run specs under kcov
        run: kcov --include-path=src "$PWD/coverage" ./bin/spec_runner

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/spec_runner/cobertura.xml
          format: cobertura
